spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: app-user-pool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate # KHÔNG BAO GIỜ update — xem AGENTS.md
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# DataSource thứ hai — role app_admin (BYPASSRLS), chỉ inject trong package admin/.
# Không có url/username/password ở đây — nằm trong application-local.yml (không commit).
app:
  admin-datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: app-admin-pool
      maximum-pool-size: 5
  jwt:
    # Stage 0: JWT tự cấp, không OTP không provider ngoài (docs/70-stages.md). Secret dev
    # commit tạm ở đây vì local-only, không có luồng tiền/OTP nào phụ thuộc vào nó — DỪNG
    # LẠI và chuyển sang secret store thật trước khi có Stage 1 (VPS thật).
    secret: "dev-only-jwt-secret-DO-NOT-USE-IN-PROD-32bytes+"
    expiration-minutes: 720
  # Stage 1 — object storage cho ảnh (R2/MinIO). Mặc định "local" = hành vi Stage 0 y hệt cũ.
  storage:
    mode: local
  # Stage 1 — FCM. Mặc định TẮT: chưa có Firebase project thật thì app chạy y hệt Stage 0
  # (outbox worker chỉ log qua LogOnlyFcmSender, không crash, không cần cấu hình gì thêm).
  firebase:
    enabled: false

---
# Profile local — nạp thêm mock data 2 shop (V900/V901), CHỈ ở local.
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/migration-local
