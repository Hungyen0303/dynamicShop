org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Tắt Kotlin incremental compilation — bug đã biết trên Windows khi project (E:) và
# pub cache (C:) khác ổ đĩa ("this and base files have different roots"), làm daemon
# compile treo/lỗi. Không ảnh hưởng gì trên máy build thật (Linux CI, macOS) — chỉ chậm
# hơn một chút lúc build lại, đổi lấy build không bị treo trên máy dev Windows.
kotlin.incremental=false
